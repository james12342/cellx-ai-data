server {
    server_name app.cellaidata.com 44.240.97.37 _;
    charset utf-8;

    client_max_body_size 4096m;

    if ($request_uri ~ "/actuator") {
        return 403;
    }

    location /prod-api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /prod-ai/ {
        proxy_pass http://10.188.30.93:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /portal/ {
        alias /var/www/rdp-marketing-site/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    location ^~ /ext-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /workflow/ {
        alias /var/www/cellx-extension-ui/;
        index index.html;
        try_files $uri $uri/ /workflow/index.html;
    }

    location ^~ /ext/ {
        return 301 /workflow/;
    }

    location / {
        root /usr/share/cellx-base-ui;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cellaidata.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cellaidata.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name cellaidata.com www.cellaidata.com;
    charset utf-8;

    root /var/www/rdp-marketing-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cellaidata.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cellaidata.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.cellaidata.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cellaidata.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name cellaidata.com www.cellaidata.com;
    return 404; # managed by Certbot




}server {
    if ($host = app.cellaidata.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.cellaidata.com 44.240.97.37 _;
    return 404; # managed by Certbot


}
