server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.cellaidata.com 44.240.97.37 _;
    charset utf-8;

    client_max_body_size 4096m;

    if ($request_uri ~ "/actuator") {
        return 403;
    }

    location /prod-api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /prod-ai/ {
        proxy_pass http://10.188.30.93:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /portal/ {
        alias /var/www/rdp-marketing-site/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    location / {
        root /usr/share/cellx-base-ui;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cellaidata.com www.cellaidata.com;
    charset utf-8;

    root /var/www/rdp-marketing-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
